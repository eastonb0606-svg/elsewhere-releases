plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "elsewhere_rival_hrafnholt"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elsewhere_rival_hrafnholt" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// `./gradlew runServer` (port 25751, run/server.properties): runs the Hrafnholt self-test and exits.
		server {
			vmArg "-Xmx1536m"
			property "hrafnholt.selftest", "true"
			property "hrafnholt.selftest.exit", "true"
		}
		client {
			vmArg "-Xmx2g"
		}
	}
}

// `./gradlew runClientGameTest` opens a real client, builds a flat world and saves screenshots to screenshots/.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elsewhere_rival_hrafnholt-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	vmArg "-Xmx2g"
	property "hrafnholt.screenshotDir", file("screenshots").absolutePath
	property "hrafnholt.bossesonly", System.getProperty("hrafnholt.bossesonly", "false")
	property "hrafnholt.castleonly", System.getProperty("hrafnholt.castleonly", "false")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Provider-lane jars (war = elsewhere_kingdom, court = elsewhere_kingdom_court, duelist = elsewhere_kingdom_duelist):
	// compiled against and loaded as mods in dev. Each lane copies its latest jar here.
	["elsewhere_kingdom", "elsewhere_kingdom_court", "elsewhere_duelist"].each { n ->
		if (file("devlibs/${n}.jar").exists()) implementation files("devlibs/${n}.jar")
	}
	// Dev only: the latest merged Elsewhere jar on the runtime classpath. Never compiled against.
	if (file('devlibs/elsewhere.jar').exists()) {
		runtimeOnly files('devlibs/elsewhere.jar')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Copies the dev jar to dist/ (`./gradlew dist`).
tasks.register('dist', Copy) {
	dependsOn 'jar'
	from(tasks.named('jar'))
	into file('dist')
}
