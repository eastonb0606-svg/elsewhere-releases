plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "elsewhere_rival_azmar"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elsewhere_rival_azmar" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// `./gradlew runServer`: flat world, own JVM, runs the Azmar self-test and exits (port 25743).
		server {
			vmArg "-Xmx1536m"
			property "azmar.selftest", "true"
			property "azmar.selftest.exit", "true"
		}
		client {
			vmArg "-Xmx2g"
		}
	}
}

// `./gradlew runClientGameTest` opens a real client and saves screenshots to screenshots/.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elsewhere_rival_azmar-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	vmArg "-Xmx2g"
	property "azmar.screenshotDir", file("screenshots").absolutePath
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Provider-lane jars (devlibs/): war = elsewhere_kingdom, court = elsewhere_kingdom_court, duelist = elsewhere_kingdom_duelist.
	implementation files('devlibs/elsewhere_kingdom.jar')
	if (file('devlibs/elsewhere_kingdom_court.jar').exists()) implementation files('devlibs/elsewhere_kingdom_court.jar')
	if (file('devlibs/elsewhere_duelist.jar').exists()) implementation files('devlibs/elsewhere_duelist.jar')
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('dist', Copy) {
	dependsOn 'jar'
	from(tasks.named('jar'))
	into file('dist')
}
