plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "elsewhere_duelist"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elsewhere_duelist" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// `./gradlew runServer` starts a dev server (port 25681, see run/server.properties)
		// that runs the duelist self-test and exits.
		server {
			vmArg "-Xmx1536m"
			property "duelist.selftest", "true"
			property "duelist.selftest.exit", "true"
			property "duelist.auditFixtures", file("audit_fixtures").absolutePath
		}
		client {
			vmArg "-Xmx2g"
		}
	}
}

// `./gradlew runClientGameTest` opens a real client, builds a test world and saves screenshots to screenshots/.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elsewhere_duelist-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	vmArg "-Xmx2g"
	property "duelist.screenshotDir", file("screenshots").absolutePath
	property "duelist.animOnly", System.getProperty("duelist.animOnly", "false")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The 15 designer cards under data/elsewhere/boss_identity are here for this module's own self-test (loader + sameness audit).
// They are not published: each kingdom lane ships its own cards, so a stale copy in this jar can never shadow them.
jar {
	exclude 'data/elsewhere/boss_identity/**'
}

// Copies the remapped dev jar to dist/ (`./gradlew dist`).
tasks.register('dist', Copy) {
	dependsOn 'jar'
	from(tasks.named('jar'))
	into file('dist')
}
