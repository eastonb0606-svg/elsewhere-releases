plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "elsewhere_kingdom_court"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elsewhere_kingdom_court" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// `./gradlew runServer` starts a dev server (port 25733, see run/server.properties)
		// that runs the court self-test + castle load test and exits.
		server {
			vmArg "-Xmx1536m"
			property "court.selftest", "true"
			property "court.selftest.exit", "true"
		}
		client {
			vmArg "-Xmx2g"
		}
		// `./gradlew runWorldgen`: fresh normal world with structures on (run-wg/), checks the castle through real worldgen.
		worldgen {
			server()
			name "Worldgen check"
			runDir "run-wg"
			vmArg "-Xmx1536m"
			property "court.worldgen", "true"
		}
	}
}

// `./gradlew runClientGameTest` opens a real client and saves the NPC and castle screenshots to screenshots/.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elsewhere_kingdom_court-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	vmArg "-Xmx2g"
	property "court.screenshotDir", file("screenshots").absolutePath
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The K-A kingdom base jar (ElsewhereContent/kingdom/dist or the K-A lane build): compiled against, and loaded as a mod in dev.
	implementation files('devlibs/elsewhere_kingdom.jar')
	// Dev only: the latest merged Elsewhere jar on the runtime classpath (Glimmer/Calling from arsenal). Never compiled against.
	if (file('devlibs/elsewhere.jar').exists()) {
		runtimeOnly files('devlibs/elsewhere.jar')
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Copies the dev jar to dist/ (`./gradlew dist`).
tasks.register('dist', Copy) {
	dependsOn 'jar'
	from(tasks.named('jar'))
	into file('dist')
}
