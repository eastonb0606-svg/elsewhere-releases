plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "elsewhere_nether_end_bosses"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elsewhere_nether_end_bosses" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// `./gradlew runServer` starts a dev server (port 25661, see run/server.properties)
		// that runs the built-in self-test and exits.
		server {
			property "nether_end_bosses.selftest", "true"
			property "nether_end_bosses.selftest.exit", "true"
			vmArg "-Xmx1536m"
		}
		client {
			vmArg "-Xmx2g"
		}
	}
}

// `./gradlew runClientGameTest` opens a real client, builds test arenas and saves screenshots to screenshots/.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elsewhere_nether_end_bosses-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	property "nether_end_bosses.screenshotDir", file("screenshots").absolutePath
	vmArg "-Xmx2g"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// fit3 self-test determinism: runners (cloud, lean-test) write a fresh run/server.properties without level-seed, so every new
// world had a random seed and the worldgen fit checks changed from run to run. Pin the module's seed when none is set.
tasks.matching { it.name == "runServer" }.configureEach {
	doFirst {
		def props = file("run/server.properties")
		def text = props.exists() ? props.getText("UTF-8") : ""
		if (!(text =~ /(?m)^level-seed=\S/)) {
			props.parentFile.mkdirs()
			props.setText(text.replaceAll(/(?m)^level-seed=.*\R?/, "") + (text.isEmpty() || text.endsWith("\n") ? "" : "\n") + "level-seed=elsewhere-nether-end\n", "UTF-8")
		}
	}
}
