plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "elsewhere_overworld_bosses"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"elsewhere_overworld_bosses" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// `./gradlew runServer` starts a dev server (port 25651, see run/server.properties)
		// that runs the module self-test and exits.
		server {
			vmArg "-Xmx1536m"
			property "overworld_bosses.selftest", "true"
			property "overworld_bosses.selftest.exit", "true"
		}
		client {
			vmArg "-Xmx2g"
		}
	}
}

// `./gradlew runClientGameTest` opens a real client, builds test worlds and saves screenshots to screenshots/.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "elsewhere_overworld_bosses-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

loom.runs.matching { it.name == "clientGameTest" }.configureEach {
	vmArg "-Xmx2g"
	property "overworld_bosses.screenshotDir", file("screenshots").absolutePath
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Copies the remapped dev jar to dist/ (`./gradlew dist`).
tasks.register('dist', Copy) {
	dependsOn 'jar'
	from(tasks.named('jar'))
	into file('dist')
}
